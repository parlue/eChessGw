; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 115200

; This is the actively-developed, multi-board-capable gateway (main.cpp and
; friends). gateway_millennium_only.cpp/gateway_v3_multiboard.cpp/
; gateway_v4_cynussupport.cpp/gateway_v5_phoenix.cpp and their _v3/_v4/_v5
; driver copies are excluded here -- they belong only to their own frozen
; environments below.
build_src_filter =
    +<*>
    -<gateway_millennium_only.cpp>
    -<gateway_v3_multiboard.cpp>
    -<*_v3.cpp>
    -<gateway_v4_cynussupport.cpp>
    -<*_v4.cpp>
    -<gateway_v5_phoenix.cpp>
    -<*_v5.cpp>
    -<gateway_v6_pgn.cpp>
    -<*_v6.cpp>
    -<gateway_v6_1_pgn_chessnut.cpp>
    -<*_v6_1.cpp>
    -<gateway_v7_cynus_chesslink.cpp>
    -<*_v7.cpp>
    -<gateway_v8_dual_service_bridge.cpp>
    -<*_v8.cpp>
    -<gateway_v9_cynus_replay.cpp>
    -<*_v9.cpp>
    -<gateway_v10_engine_vs_engine.cpp>
    -<*_v10.cpp>
    -<gateway_v11_certabo.cpp>
    -<*_v11.cpp>
    -<machine_test_*.cpp>
    -<uart_rx_diagnostic.cpp>
    -<uart_loopback_diagnostic.cpp>

; ChessLink Magic Board protocol: 38400 baud, 7 data bits, odd parity, 1 stop.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D MILLENNIUM_BAUD=38400UL
    -D CHESSLINK_ENABLE_MACHINE=1
    -D CHESSLINK_ENABLE_CERTABO=1

; NimBLE-Arduino replaces the classic BLEDevice.h client stack here -- the
; classic library's connect() has no internal timeout and was found to hang
; forever against some non-Millennium boards even when the peer accepted the
; radio-level connection. NimBLE has a real, bounded connect timeout and is
; the same library already proven reliable in this user's CynusLink project.
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.0

; Hardware-unverified Certabo BTLE preparation; opt in explicitly.
; The normal environment and frozen snapshots keep Certabo disabled.