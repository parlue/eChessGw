; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 115200

; This is the actively-developed, multi-board-capable gateway (main.cpp and
; friends). gateway_millennium_only.cpp/gateway_v3_multiboard.cpp/
; gateway_v4_cynussupport.cpp/gateway_v5_phoenix.cpp and their _v3/_v4/_v5
; driver copies are excluded here -- they belong only to their own frozen
; environments below.
build_src_filter =
    +<*>
    -<gateway_millennium_only.cpp>
    -<gateway_v3_multiboard.cpp>
    -<*_v3.cpp>
    -<gateway_v4_cynussupport.cpp>
    -<*_v4.cpp>
    -<gateway_v5_phoenix.cpp>
    -<*_v5.cpp>
    -<gateway_v6_pgn.cpp>
    -<*_v6.cpp>
    -<gateway_v6_1_pgn_chessnut.cpp>
    -<*_v6_1.cpp>
    -<gateway_v7_cynus_chesslink.cpp>
    -<*_v7.cpp>
    -<gateway_v8_dual_service_bridge.cpp>
    -<*_v8.cpp>
    -<gateway_v9_cynus_replay.cpp>
    -<*_v9.cpp>
    -<gateway_v10_engine_vs_engine.cpp>
    -<*_v10.cpp>
    -<frozen_v12/>
    -<gateway_v11_certabo.cpp>
    -<*_v11.cpp>
    -<machine_test_*.cpp>
    -<uart_rx_diagnostic.cpp>
    -<uart_loopback_diagnostic.cpp>

; ChessLink Magic Board protocol: 38400 baud, 7 data bits, odd parity, 1 stop.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D MILLENNIUM_BAUD=38400UL
    -D CHESSLINK_ENABLE_MACHINE=1
    -D CHESSLINK_ENABLE_CERTABO=1

; NimBLE-Arduino replaces the classic BLEDevice.h client stack here -- the
; classic library's connect() has no internal timeout and was found to hang
; forever against some non-Millennium boards even when the peer accepted the
; radio-level connection. NimBLE has a real, bounded connect timeout and is
; the same library already proven reliable in this user's CynusLink project.
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.0

; Hardware-unverified Certabo BTLE preparation; opt in explicitly.
; The normal environment and frozen snapshots keep Certabo disabled.
[env:esp32-c3-supermini_UartLoopback]
extends = env:esp32-c3-supermini
lib_deps =
build_src_filter =
    -<*>
    +<uart_loopback_diagnostic.cpp>

[env:esp32-c3-supermini_UartRxDiagnostic]
extends = env:esp32-c3-supermini
lib_deps =
build_src_filter =
    -<*>
    +<uart_rx_diagnostic.cpp>

[env:esp32-c3-supermini_MachineTest]
extends = env:esp32-c3-supermini
build_unflags =
    -D CHESSLINK_ENABLE_MACHINE=1
build_src_filter =
    ${env:esp32-c3-supermini.build_src_filter}
    -<main.cpp>
    -<chesslink_server.cpp>
    -<pgn_recorder.cpp>
    +<machine_test_*.cpp>

[env:esp32-c3-supermini_CertaboBLE]
extends = env:esp32-c3-supermini
build_src_filter =
    ${env:esp32-c3-supermini.build_src_filter}
    +<certabo_board.cpp>
    +<certabo_protocol.cpp>
build_flags =
    ${env:esp32-c3-supermini.build_flags}
    -D CHESSLINK_ENABLE_CERTABO=1

; Frozen fallback: builds ONLY gateway_millennium_only.cpp, a snapshot of the
; proven single-board (Millennium/ChessLink-only) gateway taken right before
; the multi-board (Chessnut and beyond) rework began. Flash this if the
; actively-developed esp32-c3-supermini environment ever regresses against
; the real King + real Millennium board -- this build is never touched by
; ongoing multi-board work. Deliberately kept on the classic BLEDevice.h
; library (no NimBLE lib_deps) -- untouched, independent of anything above.
[env:esp32-c3-superminiV2_MillenniumBoard]
extends = env:esp32-c3-supermini
lib_deps =
build_src_filter =
    -<*>
    +<gateway_millennium_only.cpp>

; Frozen fallback: builds ONLY gateway_v3_multiboard.cpp and its own _v3
; copies of board_driver/millennium_board/chessnut_board -- a snapshot of the
; proven multi-board gateway (Millennium + Chessnut + Mephisto Phoenix, all
; confirmed working) taken right before Cynus (third board type) integration
; began. Flash this if the actively-developed esp32-c3-supermini environment
; ever regresses during Cynus work -- this build is never touched afterward.
[env:esp32-c3-superminiV3_ChessnutSupport]
extends = env:esp32-c3-supermini
build_src_filter =
    -<*>
    +<gateway_v3_multiboard.cpp>
    +<board_driver_v3.cpp>
    +<millennium_board_v3.cpp>
    +<chessnut_board_v3.cpp>

; Frozen fallback: builds ONLY gateway_v4_cynussupport.cpp and its own _v4
; copies of board_driver/millennium_board/chessnut_board/cynus_board -- a
; snapshot of the gateway taken right after Cynus (ManyaCynus) support was
; confirmed working end-to-end on real hardware (King, Mephisto Phoenix,
; castling/en passant/promotion via Cynus's robot arm). Flash this if the
; actively-developed esp32-c3-supermini environment ever regresses during
; later work -- this build is never touched afterward.
[env:esp32-c3-superminiV4_CynusSupport]
extends = env:esp32-c3-supermini
build_src_filter =
    -<*>
    +<gateway_v4_cynussupport.cpp>
    +<board_driver_v4.cpp>
    +<millennium_board_v4.cpp>
    +<chessnut_board_v4.cpp>
    +<cynus_board_v4.cpp>

; Frozen fallback (v5.2): builds ONLY gateway_v5_phoenix.cpp and its own _v5
; copies of board_driver/millennium_board/chessnut_board/cynus_board/
; chesslink_server/chessnut_server -- a snapshot of the gateway taken after
; two milestones: (1) the Chessnut+Mephisto Phoenix status-checksum bug
; (outgoing checksums computed over the odd-parity-encoded bytes instead of
; plain content) was found and fixed, confirmed working end-to-end on real
; hardware -- single-square changes, captures and castling all correctly
; registered through a full real game on direct cable connection; (2) the
; BT-BT ChessLink masquerade's LED-suggestion decode was fixed for BearChess
; -- a ghost-square-elimination filter (built for Phoenix's own reset splash)
; was wrongly eating small real 2-3-square move suggestions from BearChess
; (threshold raised 3->8 plus a new geometric+corner-uniformity ghost check),
; and chesslink_server.cpp's writeFrame()/onSubscribe() gained the same
; reason-logging chessnut_server.cpp already had. Flash this if the
; actively-developed esp32-c3-supermini environment ever regresses during
; later work -- this build is never touched afterward.
[env:esp32-c3-superminiV5_Phoenix]
extends = env:esp32-c3-supermini
build_src_filter =
    -<*>
    +<gateway_v5_phoenix.cpp>
    +<board_driver_v5.cpp>
    +<millennium_board_v5.cpp>
    +<chessnut_board_v5.cpp>
    +<cynus_board_v5.cpp>
    +<chesslink_server_v5.cpp>
    +<chessnut_server_v5.cpp>

; Frozen fallback (v6.0): builds ONLY gateway_v6_pgn.cpp and its own _v6
; copies of board_driver/millennium_board/chessnut_board/cynus_board/
; chesslink_server/chessnut_server/pgn_recorder/usb_pgn_dump -- a snapshot of
; the gateway taken once automatic PGN game recording and its USB-based
; retrieval/deletion path (queen-gesture trigger, standalone Windows client,
; delete-on-confirmed-transfer) were both confirmed working end-to-end on
; real hardware. Flash this if the actively-developed esp32-c3-supermini
; environment ever regresses during later work -- this build is never
; touched afterward.
[env:esp32-c3-superminiV6_PGN]
extends = env:esp32-c3-supermini
build_src_filter =
    -<*>
    +<gateway_v6_pgn.cpp>
    +<board_driver_v6.cpp>
    +<millennium_board_v6.cpp>
    +<chessnut_board_v6.cpp>
    +<cynus_board_v6.cpp>
    +<chesslink_server_v6.cpp>
    +<chessnut_server_v6.cpp>
    +<pgn_recorder_v6.cpp>
    +<usb_pgn_dump_v6.cpp>

; Frozen fallback (v6.1): builds ONLY gateway_v6_1_pgn_chessnut.cpp and its
; own _v6_1 copies of every driver/server file -- a snapshot of the gateway
; taken once the whole Chess PGN Master BLE retrieval story was confirmed
; working end-to-end on real hardware, alongside one other fix: (1) the
; king-gesture result signal no longer loses the game if its target squares
; (d4/d5/e4/e5) were occupied or the two kings arrived separately (unlimited
; patience for in-progress gesture states instead of counting against the
; desync-recovery timeout); (2) Chess PGN Master's BLE file download -- the
; real EasyLinkSDK only accumulates a position if the notify payload starts
; with byte 0x01 (a raw board-status frame), not the FEN-text this project
; used to send; fixed by sending raw buildBoardFrame()-format frames
; instead; (3) the gateway now actually deletes a game from its own storage
; on the client's post-transfer 0x39 request (previously acked without
; deleting) -- without this, Chess PGN Master's own automatic repeated
; 0x31/0x33/0x34 polling (633 cycles observed in one real capture) kept
; re-fetching the same still-available game, producing hundreds of
; duplicate copies in one saved .pgn file. Also includes the first
; (real-hardware-untested) iChessOne BLE board driver. Flash this if the
; actively-developed esp32-c3-supermini environment ever regresses during
; later work -- this build is never touched afterward.
[env:esp32-c3-superminiV6_1_PGN_Chessnut]
extends = env:esp32-c3-supermini
build_src_filter =
    -<*>
    +<gateway_v6_1_pgn_chessnut.cpp>
    +<board_driver_v6_1.cpp>
    +<millennium_board_v6_1.cpp>
    +<chessnut_board_v6_1.cpp>
    +<cynus_board_v6_1.cpp>
    +<chesslink_server_v6_1.cpp>
    +<chessnut_server_v6_1.cpp>
    +<pgn_recorder_v6_1.cpp>
    +<usb_pgn_dump_v6_1.cpp>
    +<ichessone_board_v6_1.cpp>

; Dedicated Cynus + ChessLink-only build, added at the user's own request
; 2026-09-04: on the shared multi-board gateway above, chesslinkServerInit()
; and chessnutServerInit() both run unconditionally at boot, so BOTH
; masquerade services' GATT characteristics stay live regardless of which
; mode was actually selected -- confirmed on real hardware that a
; multi-protocol BLE client (BearChess) discovers and probes both, even on a
; connection with no prior history of this device. This environment
; sidesteps that whole class of bug by construction: only Cynus and only
; ChessLink are ever compiled in, so there is only one service to find.
; Carries every current Cynus feature (robot move execution with echo
; protection, castling/king-gesture handling, illegal-move-check
; auto-disable, PGN recording + retrieval). Shared status output preserves
; Mode-B wire order, as verified in BearChess's receive log on 2026-09-08 --
; unsuffixed cynus_board.cpp/chesslink_server.cpp/pgn_recorder.cpp are used
; as-is (not a frozen _vN copy) so this build always reflects the latest
; logic from the two files above, not a snapshot.
[env:esp32-c3-superminiV7_CynusChessLinkOnly]
extends = env:esp32-c3-supermini
build_unflags =
    -D CHESSLINK_ENABLE_MACHINE=1
build_src_filter =
    -<*>
    +<gateway_v7_cynus_chesslink.cpp>
    +<board_driver_v7.cpp>
    +<cynus_board.cpp>
    +<chesslink_server.cpp>
    +<pgn_recorder.cpp>
    +<usb_pgn_dump_v7.cpp>

; Frozen full-featured snapshot, 2026-09-08. Carries every board driver
; (Millennium/T2, Chessnut, Cynus, iChessOne) and both BLE masquerade
; servers (ChessLink, Chessnut) with the bidirectional cross-service bridge
; between them -- a real BLE client's own generic discovery can land on
; either of the two simultaneously-present GATT services regardless of
; which BT-BT mode was actually selected (confirmed on real hardware in
; both directions, see [[project_chessnut_bc_status_push_fix]] memory), and
; each side now forwards a misdirected write to the other's command
; dispatch and replies over whichever characteristic the client actually
; subscribed to. Also carries the outgoing ChessLink status-frame fix
; (writeFrame() was appending a second checksum on top of an already-
; complete frame, sending 69 bytes instead of 67 with 2 garbage bytes where
; the real checksum should be -- confirmed as the root cause of BearChess/
; Chess Dojo never progressing past their own connection handshake) and the
; ChesslinkStatusRefresh-based settle-then-resend logic (replaces an
; immediate mid-handshake status push that could arrive between a client's
; own request/reply pairs). This is the reference point for "the session
; that fixed dual-service GATT confusion + the status-frame length bug" --
; kept as a comparison baseline going forward, not meant to be built/flashed
; as the primary firmware (esp32-c3-supermini above is that).
[env:esp32-c3-superminiV8_DualServiceBridge]
extends = env:esp32-c3-supermini
build_src_filter =
    -<*>
    +<gateway_v8_dual_service_bridge.cpp>
    +<board_driver_v8.cpp>
    +<chesslink_server_v8.cpp>
    +<chessnut_board_v8.cpp>
    +<chessnut_server_v8.cpp>
    +<cynus_board_v8.cpp>
    +<ichessone_board_v8.cpp>
    +<millennium_board_v8.cpp>
    +<pgn_recorder_v8.cpp>
    +<usb_pgn_dump_v8.cpp>

; Frozen fallback (v9, "CynusReplay"): a snapshot of the gateway taken once
; pure software-driven replay over the ChessLink BLE masquerade (both
; colors arriving via the LED channel, no human scan ever, e.g. Chess PGN
; Master stepping through a loaded game) was confirmed working end-to-end
; on real hardware -- multiple full games including captures and both
; castles, with the pre-existing King/Phoenix cable path and BearChess
; confirmed unaffected. Three fixes went into this, all scoped so cable
; behavior is provably untouched: (1) chesslink_server.cpp's BLE 'L'-frame
; handler now undoes a 180-degree rotation of the 81-corner LED grid before
; handing it to the shared decoder -- BLE app clients (Chess Dojo, PGN
; Master) encode that grid mirrored relative to real King/Phoenix cable
; hardware even though it's the identical wire format (confirmed via a real
; Dojo game: outgoing status reached Dojo correctly oriented, but Dojo's
; own move highlights decoded mirrored, e.g. e2-e4 arriving as d7-d5); the
; correction lives only at this BLE entry point, never inside the shared
; decoder itself, so the cable path (main.cpp's UART frames) is unchanged.
; (2) cynus_board.cpp's cynusHandleLedFrame() and
; extractMoveFromLCommand() now use engineMayMoveNow()/sideToMoveNow
; instead of the old moveCycle-gate and game-long-fixed engineSide
; whenever no human has ever scanned a move this game
; (!firstMoveOrientationLocked) -- both LED-channel moves used to require
; alternating WaitEngineMove/WaitHumanMove state and a single fixed engine
; color, which silently dropped or rejected every other move in a pure
; replay (nothing ever scans to flip moveCycle back, and both colors need
; to be accepted). The instant a human's own scan locks orientation, this
; reverts to the exact original engineSide-based safety boundary. (3) the
; automatic "scan looks flipped -> send flip on" heuristic (both the LED-
; channel's old lockFirstMoveOrientation(true) trigger and
; handleStartupBoard()'s flipped-start-pattern match) was removed entirely
; -- decided explicitly: flip must only ever come from the manual black-
; king gesture (b5 on, b6 off; moved from h5/h6 to sit next to c/d/e in the
; existing option menu), never inferred, since a genuinely flipped Cynus
; can still report a normal-looking FEN. Flash this if the actively-
; developed esp32-c3-supermini environment ever regresses during later
; work -- this build is never touched afterward.
[env:esp32-c3-superminiV9_CynusReplay]
extends = env:esp32-c3-supermini
build_src_filter =
    -<*>
    +<gateway_v9_cynus_replay.cpp>
    +<board_driver_v9.cpp>
    +<chesslink_server_v9.cpp>
    +<chessnut_board_v9.cpp>
    +<chessnut_server_v9.cpp>
    +<cynus_board_v9.cpp>
    +<ichessone_board_v9.cpp>
    +<millennium_board_v9.cpp>
    +<pgn_recorder_v9.cpp>
    +<usb_pgn_dump_v9.cpp>

; Frozen fallback (v10, "EngineVsEngine"): a snapshot of the gateway taken
; at the user's own request, carrying the machine_gateway.cpp/newgame_button.cpp
; subsystem (CHESSLINK_ENABLE_MACHINE) alongside everything already shipped
; in v9.3 (see the V9_CynusReplay section above for that history). Also
; duplicates include/machine/*.h into include/machine_v10/ (machine.h's own
; #include "board_driver.h" would otherwise pull in the unversioned header
; alongside board_driver_v10.h and collide -- confirmed as a real duplicate-
; definition build error, not a theoretical risk). Like every other frozen
; snapshot here, this still does NOT duplicate the couple of small headers
; this project already treats as shared/stable across all snapshots
; (cable_status_policy.h, millennium_link_watchdog.h). Flash this if the
; actively-developed esp32-c3-supermini environment ever regresses during
; later work -- this build is never touched afterward.
[env:esp32-c3-superminiV10_EngineVsEngine]
extends = env:esp32-c3-supermini
build_src_filter =
    -<*>
    +<gateway_v10_engine_vs_engine.cpp>
    +<board_driver_v10.cpp>
    +<chesslink_server_v10.cpp>
    +<chessnut_board_v10.cpp>
    +<chessnut_server_v10.cpp>
    +<cynus_board_v10.cpp>
    +<ichessone_board_v10.cpp>
    +<machine_gateway_v10.cpp>
    +<millennium_board_v10.cpp>
    +<newgame_button_v10.cpp>
    +<pgn_recorder_v10.cpp>
    +<usb_pgn_dump_v10.cpp>

; Frozen fallback (v11, "Certabo"): a snapshot of the actively-developed
; esp32-c3-supermini gateway taken 2026-10-11 at the user's own request, the
; first release that carries Certabo (BLE, Nordic UART) support, the King/
; Phoenix LED handling for it, the ChessLink/Chessnut BLE masquerade without
; the old 180-degree LED rotation, plus everything shipped in v10. Like every
; frozen snapshot here it duplicates sources and headers with a _v11 suffix
; (include/machine -> include/machine_v11) and does NOT duplicate the two small
; headers treated as shared/stable across all snapshots (cable_status_policy.h,
; millennium_link_watchdog.h). Development continues in esp32-c3-supermini;
; this environment is never touched afterward.
[env:esp32-c3-superminiV11_Certabo]
extends = env:esp32-c3-supermini
build_src_filter =
    -<*>
    +<gateway_v11_certabo.cpp>
    +<board_driver_v11.cpp>
    +<certabo_board_v11.cpp>
    +<certabo_protocol_v11.cpp>
    +<chesslink_server_v11.cpp>
    +<chessnut_board_v11.cpp>
    +<chessnut_server_v11.cpp>
    +<chessnutmove_board_v11.cpp>
    +<cynus_board_v11.cpp>
    +<ichessone_board_v11.cpp>
    +<machine_gateway_v11.cpp>
    +<millennium_board_v11.cpp>
    +<newgame_button_v11.cpp>
    +<pgn_recorder_v11.cpp>
    +<usb_pgn_dump_v11.cpp>

; V12: tester-confirmed Certabo/Spectrum release, frozen 2026-10-28.
; Entire project-header dependency closure is local to src/frozen_v12.
; This environment does not inherit active development settings.
[env:esp32-c3-superminiV12_Spectrum]
platform = espressif32 @ 7.0.1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 115200
build_src_filter =
    -<*>
    +<frozen_v12/>
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D MILLENNIUM_BAUD=38400UL
    -D CHESSLINK_ENABLE_MACHINE=1
    -D CHESSLINK_ENABLE_CERTABO=1
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.1
